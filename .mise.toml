# All CLIs used by this repo, pinned. Renovate bumps these (mise manager).
[tools]
age = "1.3.2"
sops = "3.13.3"
talosctl = "1.14.4"
talhelper = "3.1.17"
flux2 = "2.9.6"
kubectl = "1.37.1"
opentofu = "1.13.2"
task = "3.54.0"
gitleaks = "8.30.1"
pre-commit = "4.7.0"

[env]
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/prod/clusterconfig/talosconfig"
